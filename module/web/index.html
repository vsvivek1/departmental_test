<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Departmental Test Prep</title>
<style>
:root{--bg:#fff;--fg:#1b1f24;--mut:#667085;--card:#f5f7fa;--acc:#1a56db;--bad:#c0392b;--ok:#1e8e3e}
@media(prefers-color-scheme:dark){:root{--bg:#12161c;--fg:#e8ecf1;--mut:#97a1b0;--card:#1c222b;--acc:#6ea0ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:12px;padding:16px;margin:12px 0}
button,select{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--mut);background:var(--card);color:var(--fg)}
button.p{background:var(--acc);color:#fff;border:0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.mut{color:var(--mut);font-size:14px}.q{font-size:18px}.quote{border-left:3px solid var(--acc);padding-left:10px;margin:8px 0}
</style></head><body><main id="app"></main>
<script type="module" src="app.js"></script></body></html>
